name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: preflight
          POSTGRES_USER: preflight
          POSTGRES_PASSWORD: preflight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U preflight -d preflight"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm config set @starkware-libs:registry=https://npm.pkg.github.com
      - run: npm config set //npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          DATABASE_URL: postgres://preflight:preflight@localhost:5432/preflight
          TEST_DATABASE_URL: postgres://preflight:preflight@localhost:5432/preflight_test
          STRK20_POOL_ADDRESS: '0x123'
